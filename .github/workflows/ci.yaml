name: CI Pipeline

on:
  push:
    branches:
      - 'main'
      - 'develop'
      - 'refactor/crawler-oop-implementation'
      - 'refactor/llm_client'
      - 'refactor/llm-client-template-methods-pattern'
      - 'refactor/error_handling'

  pull_request:
    branches:
      - 'main'
      - 'develop'
      - 'refactor/llm_client'
      - 'refactor/llm-client-template-methods-pattern'
      - 'refactor/error_handling'

jobs:
  test:
    runs-on: [F74136843]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-mock pytest-cov

      - name: Run unit tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          JWT_ALGORITHM: HS256
          JWT_AUTH_TOKEN_URL: /api/v1/users/login
          PRICING_NECESSITIES_PRICE_API_URL: https://opendata.ey.gov.tw/api/ConsumerProtection/NecessitiesPrice
          NEWS_UDN_API_URL: https://udn.com/api/more
          GLOBAL_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GLOBAL_API_PREFIX: /api/v1
          GLOBAL_DATABASE_URL: sqlite:///news_database.db
          GLOBAL_CORS_ALLOW_ORIGINS: http://localhost:8080
          GLOBAL_PROFILES_SAMPLE_RATE: 1.0
          GLOBAL_TRACES_SAMPLE_RATE: 1.0
          GLOBAL_FETCH_NEWS_INTERVAL_MINUTES: 100
          AI_OPEN_AI_KEY: ${{ secrets.OPENAI_KEY }}
          AI_OPEN_AI_MODEL: gpt-turbo-3.5
        run: |
          cd backend
          pytest tests/unit --cov=src --cov-report=xml --disable-warnings

      - name: Run integration tests (with mock DB)
        env:
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          JWT_ALGORITHM: HS256
          JWT_AUTH_TOKEN_URL: /api/v1/users/login
          PRICING_NECESSITIES_PRICE_API_URL: https://opendata.ey.gov.tw/api/ConsumerProtection/NecessitiesPrice
          NEWS_UDN_API_URL: https://udn.com/api/more
          GLOBAL_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GLOBAL_API_PREFIX: /api/v1
          GLOBAL_DATABASE_URL: sqlite:///news_database.db
          GLOBAL_CORS_ALLOW_ORIGINS: http://localhost:8080
          GLOBAL_PROFILES_SAMPLE_RATE: 1.0
          GLOBAL_TRACES_SAMPLE_RATE: 1.0
          GLOBAL_FETCH_NEWS_INTERVAL_MINUTES: 100
          AI_OPEN_AI_KEY: ${{ secrets.OPENAI_KEY }}
          AI_OPEN_AI_MODEL: openai:gpt-3.5-turbo
          AI_ANTHROPIC_API_KEY: ${{ secrets.AUTHROPIC_API_KEY }}
          AI_ANTHROPIC_MODEL: anthropic:claude-3-5-sonnet-20240620

        run: |
          cd backend
          pytest tests/integration --cov=src --cov-report=xml --disable-warnings

      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage.xml

